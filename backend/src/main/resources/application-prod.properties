# Prod-profile overrides.
logging.level.root=INFO
spring.jpa.show-sql=false

# The guest cart's JSESSIONID cookie must round-trip between the deployed
# frontend and backend, which sit on different origins (e.g. a *.vercel.app
# SPA calling a *.onrender.com API). Without SameSite=None, browsers apply
# the Lax default and silently drop the cookie on cross-site fetch/XHR calls,
# so every request looks like a brand-new anonymous session. None requires
# Secure, which is already true here since both origins are HTTPS-only.
server.servlet.session.cookie.same-site=none
