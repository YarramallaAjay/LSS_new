spring.application.name=LalithaSweets

# ===============================
# DATABASE CONFIG
# All secrets come from environment variables (see .env.example) so
# nothing sensitive is committed to source control.
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lalitha_surya_sweets}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

# ===============================
# MAIL
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:singidi.02@gmail.com}
spring.mail.password=${MAIL_PASSWORD:mlnqxgqmpvvzymab}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===============================
# ACTIVE PROFILE
# ===============================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===============================
# WHATSAPP
# ===============================
whatsapp.admin.number=${WHATSAPP_ADMIN_NUMBER:919177327911}
whatsapp.gateway.url=${WHATSAPP_GATEWAY_URL:http://localhost:3000/send}

# ===============================
# RAZORPAY
# ===============================
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_SdycDDBz9s8JbW}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:hOmoZ6EX5R4XX3ct34C7xSUs}

# ===============================
# INITIAL ADMIN SEED (used once, on an empty admins table)
# ===============================
app.admin.default-username=${ADMIN_DEFAULT_USERNAME:admin}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD:admin123}

# ===============================
# JWT (admin auth)
# ===============================
app.jwt.secret=${JWT_SECRET:change-this-dev-only-secret-please-override-in-env}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# CORS - comma separated list of origins allowed to call this API
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Public URL of the React frontend, used to build track-order links inside
# emails and WhatsApp notifications.
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Public URL of this backend itself, used to build direct API links
# (e.g. the invoice PDF download link) inside emails.
app.backend.base-url=${BACKEND_BASE_URL:http://localhost:8080}
