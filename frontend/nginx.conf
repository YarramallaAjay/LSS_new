server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real static file goes to index.html
    # so React Router can handle client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed build assets.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
